name = "northstar-image-generator"
main = "src/index.js"
compatibility_date = "2026-11-20"
workers_dev = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "db"
database_name = "northstar-production"
database_id = "ec0ca8de-3051-404b-8d4b-d5c61a127f96"

# Keep Preview isolated: do not bind it to the production D1 database.
[previews]

[vars]
ALLOWED_ORIGIN = "https://kibruder.github.io"

[[r2_buckets]]
binding = "AWIN_CATALOG"
bucket_name = "northstar-awin-catalog"
