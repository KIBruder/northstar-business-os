name: Validate Northstar
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/automatic-screenshot-ocr, feature/content-production-workflow]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependency
        run: npm install --no-save --no-package-lock fake-indexeddb@6.2.4
      - name: Run IndexedDB integration tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check db.js
          node --check analysis-engine.js
          node --check sw.js
          node --check cloudflare-worker/src/index.js
