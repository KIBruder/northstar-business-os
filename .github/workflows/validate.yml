name: Validate Northstar
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/automatic-screenshot-ocr]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check db.js
          node --check analysis-engine.js
          node --check sw.js
